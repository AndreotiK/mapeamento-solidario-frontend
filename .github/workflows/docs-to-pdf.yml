name: Docs to PDF

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - '.github/workflows/docs-to-pdf.yml'

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Pandoc e LaTeX
        run: |
          sudo apt-get update
          # Trocamos o pacote recomendado pelo texlive-xetex
          sudo apt-get install -y pandoc texlive-xetex texlive-fonts-recommended

      - name: Converter Markdown para PDF
        run: |
          # Usamos a flag +raw_tex para aceitar o comando \newpage
          pandoc docs/*.md -o manual-mapeamento-solidario.pdf \
            --from markdown+raw_tex \
            --resource-path=docs \
            --pdf-engine=xelatex \
            -V geometry:margin=2cm \
            -V linkcolor=blue

      - name: Upload do PDF como artifact
        uses: actions/upload-artifact@v4
        with:
          name: manual-pdf
          path: manual-mapeamento-solidario.pdf